[unstable]
json-target-spec = true
build-std = ["core", "alloc", "compiler_builtins"]
build-std-features = ["compiler-builtins-mem"]

# clang knows nothing about the 'catten' environment component in our custom target triples, so
# ft-wrapper's build script maps each architecture onto a bare-metal ELF triple and derives the
# matching C flags itself. Nothing needs to be set here for that to work.
